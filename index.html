<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت استراحت پشتیبانی - طلاین</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: #ffffff;
            color: #1f2937;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(212, 175, 55, 0.25);
            border: 2px solid #d4af37;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-container img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            padding: 5px;
            background: #121212;
            object-fit: contain;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #1f2937;
            font-size: 1.4rem;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
        }

        input, select, button {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        .btn-start {
            background-color: #2563eb;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-start:hover {
            background-color: #1d4ed8;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 25px 0 15px;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 8px;
        }

        .active-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s;
        }

        .card.overtime {
            background: #fef2f2;
            border-color: #fecaca;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .agent-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #111827;
        }

        .badge {
            background: #e0e7ff;
            color: #3730a3;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .card.overtime .badge {
            background: #fee2e2;
            color: #991b1b;
        }

        .timer {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin: 10px 0;
            direction: ltr;
            color: #312e81;
        }

        .card.overtime .timer {
            color: #dc2626;
        }

        .time-info {
            font-size: 0.85rem;
            color: #4b5563;
            margin-bottom: 12px;
            text-align: center;
        }

        .btn-return {
            background-color: #581c87; /* رنگ بنفش درخواستی */
            color: white;
            border: none;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            padding: 10px;
            transition: 0.2s;
        }

        .btn-return:hover {
            background-color: #4c1d95;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.95rem;
            color: #1f2937;
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
            color: #4b5563;
        }

        .status-ok {
            color: #059669;
            font-weight: 600;
        }

        .status-late {
            color: #dc2626;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-clear {
            background: #581c87; /* رنگ بنفش برای دکمه پاک کردن تاریخچه */
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-clear:hover {
            background: #4c1d95;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <!-- استفاده از لوگوی طلاین -->
        <img src="logo.png" alt="لوگو طلاین" onerror="this.style.display='none'">
    </div>
    <h1>ثبت ورود و خروج استراحت کارشناسان پشتیبانی</h1>

    <div class="control-panel">
        <input type="text" id="agentName" placeholder="نام و نام خانوادگی کارشناس..." autocomplete="off">
        <select id="restDuration">
            <option value="5">استراحت (۵ دقیقه)</option>
            <option value="10" selected>استراحت (۱۰ دقیقه)</option>
            <option value="15">استراحت (۱۵ دقیقه)</option>
            <option value="20">استراحت (۲۰ دقیقه)</option>
        </select>
        <button class="btn-start" onclick="startRest()">شروع استراحت</button>
    </div>

    <div class="section-title">کارشناسان در حال استراحت</div>
    <div class="active-list" id="activeList"></div>

    <div class="header-actions section-title">
        <span>گزارش ترددهای امروز</span>
        <button class="btn-clear" onclick="clearLogs()">پاک کردن تاریخچه</button>
    </div>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>نام کارشناس</th>
                    <th>ساعت رفت</th>
                    <th>ساعت برگشت</th>
                    <th>مدت کل استراحت</th>
                    <th>وضعیت</th>
                </tr>
            </thead>
            <tbody id="historyTable"></tbody>
        </table>
    </div>
</div>

<script>
    let activeRests = JSON.parse(localStorage.getItem('activeRests')) || [];
    let historyLogs = JSON.parse(localStorage.getItem('historyLogs')) || [];

    function saveData() {
        localStorage.setItem('activeRests', JSON.stringify(activeRests));
        localStorage.setItem('historyLogs', JSON.stringify(historyLogs));
    }

    function formatTime(timestamp) {
        const date = new Date(timestamp);
        return date.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function formatDuration(seconds) {
        const absSec = Math.abs(Math.floor(seconds));
        const m = Math.floor(absSec / 60).toString().padStart(2, '0');
        const s = (absSec % 60).toString().padStart(2, '0');
        return (seconds < 0 ? '-' : '') + `${m}:${s}`;
