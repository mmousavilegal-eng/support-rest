<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت استراحت - طلاین</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #faf8f5;
            color: #2c2c2c;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            border: 3px solid #d4af37;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.2);
        }

        /* هدر و لوگو */
        header {
            text-align: center;
            border-bottom: 2px solid #f3eacb;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            background: #d4af37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            border: 2px solid #fff;
        }

        .brand-text {
            font-size: 1.6rem;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: -0.5px;
        }

        .sub-brand {
            font-size: 0.85rem;
            color: #5c1d6b;
            font-weight: 600;
        }

        /* پنل کنترل ثبت */
        .control-box {
            background: linear-gradient(135deg, #fffdf7, #f7f1e3);
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
        }

        .control-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #5c1d6b;
            margin-bottom: 15px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 2fr 1.5fr auto;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
        }

        input, select, button {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #d4af37;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input {
            background: #fff;
            color: #333;
        }

        input:focus, select:focus {
            border-color: #5c1d6b;
            box-shadow: 0 0 0 3px rgba(92, 29, 107, 0.15);
        }

        select {
            background: #5c1d6b;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-start {
            background: linear-gradient(135deg, #d4af37, #b89728);
            color: #fff;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
            padding: 12px 24px;
        }

        .btn-start:hover {
            background: linear-gradient(135deg, #b89728, #9a7d1f);
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 25px 0 15px;
            color: #5c1d6b;
            border-bottom: 2px solid #f3eacb;
            padding-bottom: 8px;
        }

        /* کارت‌های افراد در حال استراحت */
        .active-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            transition: all 0.3s;
