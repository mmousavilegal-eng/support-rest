<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت استراحت پشتیبانی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #111827;
            font-size: 1.5rem;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
        }

        input, select, button {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-start {
            background-color: #2563eb;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-start:hover {
            background-color: #1d4ed8;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 20px 0 12px;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 8px;
        }

        .active-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s;
        }

        .card.overtime {
            background: #fef2f2;
            border-color: #fecaca;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .agent-name {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .card.overtime .badge {
            background: #fee2e2;
            color: #991b1b;
        }

        .timer {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin: 10px 0;
            direction: ltr;
            color: #1e3a8a;
        }

        .card.overtime .timer {
            color: #dc2626;
        }

        .time-info {
            font-size: 0.85rem;
            color: #4b5563;
            margin-bottom: 12px;
            text-align: center;
        }

        .btn-return {
            background-color: #10b981;
            color: white;
            border: none;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-return:hover {
            background-color: #059669;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.95rem;
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
            color: #4b5563;
        }

        .status-ok {
            color: #059669;
            font-weight: 600;
        }

        .status-late {
            color: #dc2626;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-clear {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-clear:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ثبت ورود و خروج استراحت کارشناسان پشتیبانی</h1>

    <div class="control-panel">
        <input type="text" id="agentName" placeholder="نام و نام خانوادگی کارشناس..." autocomplete="off">
        <select id="restDuration">
            <option value="5">استراحت (۵ دقیقه)</option>
            <option value="10" selected>استراحت (۱۰ دقیقه)</option>
            <option value="20">استراحت (۲۰ دقیقه)</option>
        </select>
        <button class="btn-start" onclick="startRest()">شروع استراحت</button>
    </div>

    <div class="section-title">کارشناسان در حال استراحت</div>
    <div class="active-list" id="activeList"></div>

    <div class="header-actions section-title">
        <span>گزارش ترددهای امروز</span>
        <button class="btn-clear" onclick="clearLogs()">پاک کردن تاریخچه</button>
    </div>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>نام کارشناس</th>
                    <th>مدت مجاز</th>
                    <th>ساعت رفت</th>
                    <th>ساعت برگشت</th>
                    <th>مدت کل استراحت</th>
                    <th>وضعیت</th>
                </tr>
            </thead>
            <tbody id="historyTable"></tbody>
        </table>
    </div>
</div>

<script>
    let activeRests = JSON.parse(localStorage.getItem('activeRests')) || [];
    let historyLogs = JSON.parse(localStorage.getItem('historyLogs')) || [];

    function saveData() {
        localStorage.setItem('activeRests', JSON.stringify(activeRests));
        localStorage.setItem('historyLogs', JSON.stringify(historyLogs));
    }

    function formatTime(timestamp) {
        const date = new Date(timestamp);
        return date.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function formatDuration(seconds) {
        const absSec = Math.abs(Math.floor(seconds));
        const m = Math.floor(absSec / 60).toString().padStart(2, '0');
        const s = (absSec % 60).toString().padStart(2, '0');
        return (seconds < 0 ? '-' : '') + `${m}:${s}`;
    }

    function startRest() {
        const nameInput = document.getElementById('agentName');
        const durationSelect = document.getElementById('restDuration');
        const name = nameInput.value.trim();
        const allowedMinutes = parseInt(durationSelect.value);

        if (!name) {
            nameInput.focus();
            return;
        }

        const newRest = {
            id: Date.now(),
            name: name,
            allowedMinutes: allowedMinutes,
            startTime: Date.now()
        };

        activeRests.push(newRest);
        nameInput.value = '';
        saveData();
        render();
    }

    function endRest(id) {
        const index = activeRests.findIndex(r => r.id === id);
        if (index === -1) return;

        const rest = activeRests[index];
        const endTime = Date.now();
        const elapsedSeconds = Math.floor((endTime - rest.startTime) / 1000);
        const allowedSeconds = rest.allowedMinutes * 60;
        const isLate = elapsedSeconds > allowedSeconds;

        historyLogs.unshift({
            name: rest.name,
            allowedMinutes: rest.allowedMinutes,
            startTime: rest.startTime,
            endTime: endTime,
            elapsedSeconds: elapsedSeconds,
            isLate: isLate
        });

        activeRests.splice(index, 1);
        saveData();
        render();
    }

    function clearLogs() {
        historyLogs = [];
        saveData();
        renderHistory();
    }

    function renderActive() {
        const container = document.getElementById('activeList');
        container.innerHTML = '';

        activeRests.forEach(rest => {
            const now = Date.now();
            const elapsedSeconds = (now - rest.startTime) / 1000;
            const remainingSeconds = (rest.allowedMinutes * 60) - elapsedSeconds;
            const isOvertime = remainingSeconds < 0;

            const card = document.createElement('div');
            card.className = `card ${isOvertime ? 'overtime' : ''}`;
            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <span class="agent-name">${rest.name}</span>
                        <span class="badge">استراحت ${rest.allowedMinutes} دقیقه‌ای</span>
                    </div>
                    <div class="timer">${formatDuration(remainingSeconds)}</div>
                    <div class="time-info">زمان خروج: ${formatTime(rest.startTime)}</div>
                </div>
                <button class="btn-return" onclick="endRest(${rest.id})">ثبت بازگشت</button>
            `;
            container.appendChild(card);
        });
    }

    function renderHistory() {
        const tbody = document.getElementById('historyTable');
        tbody.innerHTML = '';

        historyLogs.forEach(log => {
            const mins = Math.floor(log.elapsedSeconds / 60);
            const secs = log.elapsedSeconds % 60;
            const durationText = `${mins} دقیقه و ${secs} ثانیه`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${log.name}</strong></td>
                <td>استراحت (${log.allowedMinutes} دقیقه)</td>
                <td>${formatTime(log.startTime)}</td>
                <td>${formatTime(log.endTime)}</td>
                <td>${durationText}</td>
                <td class="${log.isLate ? 'status-late' : 'status-ok'}">
                    ${log.isLate ? 'تاخیر در بازگشت' : 'به موقع'}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function render() {
        renderActive();
        renderHistory();
    }

    document.getElementById('agentName').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') startRest();
    });

    setInterval(renderActive, 1000);
    render();
</script>

</body>
</html>
