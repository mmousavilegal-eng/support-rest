<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت استراحت پشتیبانی - طلاین</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #faf9f6;
            color: #2b2b2b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #d4af37;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.25);
        }

        header {
            text-align: center;
            border-bottom: 2px solid #f0e6d2;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .logo-img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            border-radius: 50%;
            background: #fff;
            padding: 4px;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.4);
        }

        .brand-text {
            font-size: 1.6rem;
            font-weight: 700;
            color: #d4af37;
        }

        .sub-brand {
            font-size: 0.95rem;
            color: #5c1d6b;
            font-weight: 600;
        }

        .control-box {
            background: linear-gradient(135deg, #fffcf5, #f9f4e8);
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .control-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #3b1443;
            margin-bottom: 15px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 12px;
        }

        @media (max-width: 700px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
        }

        input, select, button {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #d4af37;
            font-size: 0.95rem;
            outline: none;
        }

        input {
            background: #fff;
            color: #333;
        }

        select {
            background: #5c1d6b;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-start {
            background: linear-gradient(135deg, #d4af37, #b89728);
            color: #fff;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 25px 0 15px;
            color: #3b1443;
            border-bottom: 2px solid #e0d5be;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
