<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت استراحت - طلاین</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #faf9f6;
            color: #2b2b2b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #d4af37;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.25);
        }

        header {
            text-align: center;
            border-bottom: 2px solid #f0e6d2;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo-svg {
            width: 65px;
            height: 65px;
        }

        .brand-text {
            font-size: 1.6rem;
            font-weight: 700;
            color: #d4af37;
        }

        .sub-brand {
            font-size: 0.85rem;
            color: #5c1d6b;
            font-weight: 600;
        }

        .control-box {
            background: linear-gradient(135deg, #fffcf5, #f9f4e8);
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .control-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #5c1d6b;
            margin-bottom: 15px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 2fr 1.5fr auto;
            gap: 12px;
        }

        @media (max-width: 700px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
        }

        input, select, button {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #d4af37;
            font-size: 0.95rem;
            outline: none;
        }

        input { background: #fff; color: #333; }

        select {
            background: #5c1d6b;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-start {
            background: linear-gradient(135deg, #d4af37, #b89728);
            color: #fff;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        .btn-start:hover { background: linear-gradient(135deg, #b89728, #9a7d1f); }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 25px 0 15px;
            color: #5c1d6b;
            border-bottom: 2px solid #e0d5be;
            padding-bottom: 8px;
        }

        .active-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .card.overtime {
            border-color: #dc2626;
            background: #fff5f5;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .agent-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #5c1d6b;
        }

        .badge {
            background: #f3eacb;
            color: #8c7113;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card.overtime .badge {
            background: #fee2e2;
            color: #991b1b;
        }

        .timer {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin: 10px 0;
            direction: ltr;
            color: #5c1d6b;
        }
        .card.overtime .timer { color: #dc2626; }

        .time-info {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .btn-return {
            background-color: #5c1d6b;
            color: white;
            border: none;
            width: 100%;
            font-weight: 700;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-return:hover { background-color: #43124e; }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e0d5be;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            background: white;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0e6d2;
            font-size: 0.9rem;
        }

        th {
            background-color: #5c1d6b;
            color: #d4af37;
            font-weight: 700;
        }

        .status-ok { color: #059669; font-weight: 700; }
        .status-late { color: #dc2626; font-weight: 700; }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-clear {
            background: #5c1d6b;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-clear:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container">
            <!-- لوگوی طلایی طلاین -->
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" fill="#facc15" stroke="#d4af37" stroke-width="3"/>
                <text x="50" y="65" font-size="52" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="Arial">ط</text>
            </svg>
            <div>
                <div class="brand-text">طلایــن</div>
                <div class="sub-brand">سیستم مدیریت استراحت پشتیبانی</div>
            </div>
        </div>
    </header>

    <div class="control-box">
        <div class="control-title">ثبت ورود و خروج استراحت کارشناسان پشتیبانی</div>
        <div class="control-panel">
            <input type="text" id="agentName" placeholder="نام و نام خانوادگی کارشناس..." autocomplete="off">
            <select id="restDuration">
                <option value="5">استراحت (۵ دقیقه)</option>
                <option value="10" selected>استراحت (۱۰ دقیقه)</option>
                <option value="15">استراحت (۱۵ دقیقه)</option>
                <option value="20">استراحت (۲۰ دقیقه)</option>
            </select>
            <button class="btn-start" onclick="startRest()">شروع استراحت</button>
        </div>
    </div>

    <div class="section-title">کارشناسان در حال استراحت</div>
    <div class="active-list" id="activeList"></div>

    <div class="header-actions section-title">
        <span>گزارش ترددهای امروز</span>
        <button class="btn-clear" onclick="clearLogs()">پاک کردن تاریخچه</button>
    </div>
    
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>نام کارشناس</th>
                    <th>مدت مجاز</th>
                    <th>ساعت رفت</th>
                    <th>ساعت برگشت</th>
                    <th>مدت کل استراحت</th>
                    <th>وضعیت</th>
                </tr>
            </thead>
            <tbody id="historyTable"></tbody>
        </table>
    </div>
</div>

<script>
    let activeRests = JSON.parse(localStorage.getItem('taline_activeRests')) || [];
    let historyLogs = JSON.parse(localStorage.getItem('taline_historyLogs')) || [];

    function saveData() {
        localStorage.setItem('taline_activeRests', JSON.stringify(activeRests));
        localStorage.setItem('taline_historyLogs', JSON.stringify(historyLogs));
    }

    function formatTime(timestamp) {
        const date = new Date(timestamp);
        return date.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function formatDuration(seconds) {
        const absSec = Math.abs(Math.floor(seconds));
        const m = Math.floor(absSec / 60).toString().padStart(2, '0');
        const s = (absSec % 60).toString().padStart(2, '0');
        return (seconds < 0 ? '-' : '') + `${m}:${s}`;
    }

    function startRest() {
        const nameInput = document.getElementById('agentName');
        const durationSelect = document.getElementById('restDuration');
        const name = nameInput.value.trim();
        const allowedMinutes = parseInt(durationSelect.value);

        if (!name) {
            nameInput.focus();
            return;
        }

        const newRest = {
            id: Date.now(),
            name: name,
            allowedMinutes: allowedMinutes,
            startTime: Date.now()
        };

        activeRests.push(newRest);
        nameInput.value = '';
