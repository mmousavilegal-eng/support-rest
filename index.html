<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشتیبانی طلاین - مدیریت استراحت کارشناسان</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #f3f4f6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-header {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-bottom: 4px solid #eab308;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.15);
        }

        .brand-title {
            color: #1f2937;
            font-weight: 700;
            font-size: 1.2rem;
            border-right: 3px solid #eab308;
            padding-right: 12px;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1f2937;
            letter-spacing: -1px;
        }

        .brand-logo span {
            color: #eab308;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-top: none;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #facc15;
            font-size: 1.4rem;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
        }

        input, select, button {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: #eab308;
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.2);
        }

        .btn-start {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #111;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-start:hover {
            background: linear-gradient(135deg, #facc15, #eab308);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 20px 0 12px;
            color: #facc15;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }

        .active-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: #262626;
            border: 1px solid #404040;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s;
        }

        .card.overtime {
            background: #3b1111;
            border-color: #ef4444;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .agent-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
        }

        .badge {
            background: #332701;
            color: #facc15;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #854d0e;
        }

        .card.overtime .badge {
            background: #501313;
            color: #fca5a5;
            border-color: #991b1b;
        }

        .timer {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin: 10px 0;
            direction: ltr;
            color: #fde047;
        }

        .card.overtime .timer {
            color: #f87171;
        }

        .time-info {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 12px;
            text-align: center;
        }

        .btn-return {
            background-color: #059669;
            color: white;
            border: none;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
        }

        .btn-return:hover {
            background-color: #047857;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #333;
            font-size: 0.95rem;
        }

        th {
            background-color: #262626;
            font-weight: 600;
            color: #eab308;
        }

        .status-ok {
            color: #34d399;
            font
