<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت استراحت - طلاین</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #faf9f6;
            color: #2b2b2b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #d4af37;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.25);
        }

        /* هدر و لوگو */
        header {
            text-align: center;
            border-bottom: 2px solid #f0e6d2;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo-img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 50%;
            background: #fff;
            padding: 4px;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.4);
        }

        .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #d4af37;
        }

        .sub-brand {
            font-size: 0.85rem;
            color: #5c1d6b;
            font-weight: 600;
        }

        /* پنل کنترل ثبت استراحت */
        .control-box {
            background: linear-gradient(135deg, #fffcf5, #f9f4e8);
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
        }

        .control-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #3b1443;
            margin-bottom: 15px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
        }

        @media (max-width: 700px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
        }

        input, select, button {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #d4af37;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input {
            background: #fff;
            color: #333;
        }

        input:focus, select:focus {
            border-color: #5c1d6b;
            box-shadow: 0 0 0 3px rgba(92, 29, 107, 0.15);
        }

        select {
            background: #5c1d6b;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-start {
            background: linear-gradient(135deg, #d4af37, #b89728);
            color: #fff;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-start:hover {
            background: linear-gradient(135deg, #b89728, #9a7d1f);
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 25px 0 15px;
            color: #3b1443;
            border-bottom: 2px solid #e0d5be;
            padding-bottom: 8px;
        }

        /* کارت‌های افراد در حال استراحت */
        .active-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }

        .card.overtime {
            border-color: #dc2626;
            background: #fff5f5;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.3); }
            70% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .agent-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #3b1443;
        }

        .badge {
            background: #f3eacb;
            color: #8c7113;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card.overtime .badge {
            background: #fee2e2;
            color: #991b1b;
        }

        .timer {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin: 10px 0;
            direction: ltr;
            color: #5c1d6b;
        }

        .card.overtime .timer {
            color: #dc2626;
        }

        .time-info {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .btn-return {
            background-color: #5c1d6b;
            color: white;
            border: none;
            width: 100%;
            font-weight: 700;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-return:hover {
            background-color: #43124e;
        }

        /* جدول گزارشات */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e0d5be;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            background: white;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0e6d2;
            font-size: 0.9rem;
        }

        th {
            background-color: #3b1443;
            color: #d4af37;
            font-weight: 700;
        }

        .status-ok {
            color: #059669;
            font-weight: 70
